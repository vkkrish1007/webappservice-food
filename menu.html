<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickBite - Menu</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        🍔 QuickBite
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="menu.html">
            Menu
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

    </nav>

</header>

<section class="categories">

    <h2>Our Menu</h2>

    <div class="category-container">

        <div class="category">

            🍕
            <h3>Margherita Pizza</h3>

            <p>₹249</p>

            <button
                class="btn"
                onclick="addToCart('Margherita Pizza',249)">

                Add to Cart

            </button>

        </div>


        <div class="category">

            🍔
            <h3>Cheese Burger</h3>

            <p>₹199</p>

            <button
                class="btn"
                onclick="addToCart('Cheese Burger',199)">

                Add to Cart

            </button>

        </div>


        <div class="category">

            🍛
            <h3>Chicken Biryani</h3>

            <p>₹299</p>

            <button
                class="btn"
                onclick="addToCart('Chicken Biryani',299)">

                Add to Cart

            </button>

        </div>


        <div class="category">

            🥤
            <h3>Cold Drink</h3>

            <p>₹79</p>

            <button
                class="btn"
                onclick="addToCart('Cold Drink',79)">

                Add to Cart

            </button>

        </div>

    </div>

</section>

<script src="js/app.js"></script>

</body>
</html>
