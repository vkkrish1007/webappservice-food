<!DOCTYPE html>

<head>

<title>VK QuickBite - Menu</title>

<body>

<header>

```
<div class="logo">
    🍔 VK QuickBite
</div>

<nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="cart.html">Cart 🛒 <span id="cartCount">0</span></a>
</nav>
```

</header>

<section class="categories">

```
<h2>Our Menu</h2>

<div class="category-container">


    <!-- Margherita Pizza -->
    <div class="category">

        <div class="food-icon">🍕</div>

        <h3>Margherita Pizza</h3>

        <p>₹249</p>

        <button
            class="btn"
            onclick="addToCart('Margherita Pizza', 249)">
            Add to Cart
        </button>

    </div>


    <!-- Cheese Burger -->
    <div class="category">

        <div class="food-icon">🍔</div>

        <h3>Cheese Burger</h3>

        <p>₹199</p>

        <button
            class="btn"
            onclick="addToCart('Cheese Burger', 199)">
            Add to Cart
        </button>

    </div>


    <!-- Chicken Biryani -->
    <div class="category">

        <div class="food-icon">🍛</div>

        <h3>Chicken Biryani</h3>

        <p>₹299</p>

        <button
            class="btn"
            onclick="addToCart('Chicken Biryani', 299)">
            Add to Cart
        </button>

    </div>


    <!-- Mutton Biryani -->
    <div class="category">

        <div class="food-icon">&#x1F35B;</div>

        <h3>Mutton Biryani</h3>

        <p>₹399</p>

        <button
            class="btn"
            onclick="addToCart('Mutton Biryani', 399)">
            Add to Cart
        </button>

    </div>


    <!-- Cold Drink -->
    <div class="category">

        <div class="food-icon">🥤</div>

        <h3>Cold Drink</h3>

        <p>₹79</p>

        <button
            class="btn"
            onclick="addToCart('Cold Drink', 79)">
            Add to Cart
        </button>

    </div>


</div>
```

</section>
